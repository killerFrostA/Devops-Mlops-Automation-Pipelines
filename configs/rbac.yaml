    - GetIncidentContext
    - GetLatestAgentResults
    - RecordDecision
    - RecordHITLDecision
  specialist_agents: [AppendAgentResult, AppendEvidence]
hitl:
  orchestrator: [CreateApproval, ResolveApproval, GetApprovalState]
  specialist_agents: []
execution:
  dashboard: []
  diagnosis-agent: []
  security-quality-agent: []
