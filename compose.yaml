name: devops-mlops-automation-pipelines

x-agent: &agent
  build: .
  image: devops-mlops-automation-pipelines:local
  profiles: [agents]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  api:
    build: .
    image: devops-mlops-automation-pipelines:local
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PIDS_ENVIRONMENT: local
      PIDS_RUNTIME_MODE: skeleton
      PIDS_SERVICE_NAME: platform-api
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  monitoring:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: monitoring-agent}
  diagnosis:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: diagnosis-agent}
  security-quality:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: security-quality-agent}
  deployment-recovery:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: deployment-recovery-agent}
  resource-optimization:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: resource-optimization-agent}
  mlops-lifecycle:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: mlops-lifecycle-agent}

  postgres:
    image: postgres:17.6-alpine
    profiles: [backbone]
    environment:
      POSTGRES_DB: pids
      POSTGRES_USER: pids
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pids -d pids"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.5-alpine
    profiles: [backbone]
    ports: ["127.0.0.1:6379:6379"]
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.1
    profiles: [backbone]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.1.1
    profiles: [backbone]
    depends_on:
      kafka: {condition: service_healthy}
    volumes: ["./infrastructure/kafka/create-topics.sh:/bootstrap/create-topics.sh:ro"]
    entrypoint: [/bin/bash, /bootstrap/create-topics.sh]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.15.4
    profiles: [intelligence]
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [intelligence]
    environment:
      MINIO_ROOT_USER: pids-local
      MINIO_ROOT_PASSWORD: local-development-only
    command: [server, /data, --console-address, ":9001"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object-data:/data"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    ports: ["127.0.0.1:9090:9090"]
    # Short retention keeps memory and disk low on a development laptop.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infrastructure/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    cpus: 0.5

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: pids-local
      GF_SECURITY_ADMIN_PASSWORD: local-development-only
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Local only (bound to 127.0.0.1): dashboards readable without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/agent1-service-health.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/src.yaml:ro
      - ./infrastructure/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/agent1.yaml:ro
      - ./infrastructure/observability/dashboards:/etc/grafana/dashboards:ro
    mem_limit: 256m
    cpus: 0.5

  # Agent 1 test bench: instrumented target service with local-only fault injection.
  target-app:
    build: ./experiments/target_app
    image: pids-target-app:local
    profiles: [observability]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SERVICE_NAME: payment-service
      CHAOS_ENABLED: "true"
      INJECTION_LOG: /app/runs/injections.jsonl
    volumes: ["./experiments/runs:/app/runs"]
    # A memory limit lets an injected memory growth end in a real OOMKilled event.
    mem_limit: 512m
    cpus: 0.5
    # Promtail turns this container label into the Loki label used by Agent 1.
    labels: {service_id: payment-service}
    restart: unless-stopped

  # Team target application (fraud detection, FastAPI + MLflow model), watched by Agent 1.
  # Built from its own repository, cloned next to this one: its code is not copied here.
  # Start: docker compose --profile observability --profile fraud up -d fraud-api
  fraud-api:
    build: ${FRAUD_API_DIR:-../Fraud_Detection_MLOps}
    image: pids-fraud-api:local
    profiles: [fraud]
    ports: ["127.0.0.1:8000:8000"]
    # Its requirements install the latest MLflow, which refuses the file model store it ships
    # with unless explicitly allowed.
    environment: {MLFLOW_ALLOW_FILE_STORE: "true"}
    mem_limit: 768m
    cpus: 1.0
    labels: {service_id: fraud-api}
    restart: unless-stopped

  # Log store queried by Agent 1 (LogQL over HTTP, port 3100).
  loki:
    image: grafana/loki:3.5.5
    profiles: [observability]
    ports: ["127.0.0.1:3100:3100"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["loki-data:/loki"]
    mem_limit: 384m
    cpus: 0.5

  # Ships container logs to Loki; only containers with a service_id label are collected.
  promtail:
    image: grafana/promtail:3.5.5
    profiles: [observability]
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infrastructure/observability/promtail.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    mem_limit: 128m
    cpus: 0.25

  # Per-container CPU/RAM metrics (container_memory_working_set_bytes, ...).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: [observability]
    ports: ["127.0.0.1:8081:8080"]
    privileged: true
    devices: ["/dev/kmsg"]
    # Containers only, measured every 30 s: cAdvisor's default settings are costly.
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 192m
    cpus: 0.25

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  qdrant-data:
  object-data:
  prometheus-data:
  grafana-data:
  loki-data:
