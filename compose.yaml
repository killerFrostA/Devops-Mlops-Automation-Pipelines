name: devops-mlops-automation-pipelines

x-agent: &agent
  build: .
  image: devops-mlops-automation-pipelines:local
  profiles: [agents]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  api:
    build: .
    image: devops-mlops-automation-pipelines:local
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PIDS_ENVIRONMENT: local
      PIDS_RUNTIME_MODE: skeleton
      PIDS_SERVICE_NAME: platform-api
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  monitoring:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: monitoring-agent}
  diagnosis:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: diagnosis-agent}
  security-quality:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: security-quality-agent}
  deployment-recovery:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: deployment-recovery-agent}
  resource-optimization:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: resource-optimization-agent}
  mlops-lifecycle:
    <<: *agent
    environment: {PIDS_SERVICE_NAME: mlops-lifecycle-agent}

  postgres:
    image: postgres:17.6-alpine
    profiles: [backbone]
    environment:
      POSTGRES_DB: pids
      POSTGRES_USER: pids
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pids -d pids"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.5-alpine
    profiles: [backbone]
    ports: ["127.0.0.1:6379:6379"]
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.1
    profiles: [backbone]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.1.1
    profiles: [backbone]
    depends_on:
      kafka: {condition: service_healthy}
    volumes: ["./infrastructure/kafka/create-topics.sh:/bootstrap/create-topics.sh:ro"]
    entrypoint: [/bin/bash, /bootstrap/create-topics.sh]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.15.4
    profiles: [intelligence]
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [intelligence]
    environment:
      MINIO_ROOT_USER: pids-local
      MINIO_ROOT_PASSWORD: local-development-only
    command: [server, /data, --console-address, ":9001"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object-data:/data"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infrastructure/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: pids-local
      GF_SECURITY_ADMIN_PASSWORD: local-development-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/src.yaml:ro

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  qdrant-data:
  object-data:
  prometheus-data:
  grafana-data:
