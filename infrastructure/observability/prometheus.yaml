global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  # Agent 1 test bench (compose profile "observability").
  - job_name: target-app
    static_configs:
      - targets: [target-app:8080]
        labels: {service_id: payment-service, namespace: local}
  # Fraud-detection API (team target application, built from its own repository).
  - job_name: fraud-api
    static_configs:
      - targets: [fraud-api:8000]
        labels: {service_id: fraud-api, namespace: local}
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
# Any project: add a job with its targets and a service_id label (app mode), or nothing at
# all for container mode (cAdvisor above already measures every Docker container).
