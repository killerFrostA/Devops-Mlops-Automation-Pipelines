# Agent 1 test bench: ship the logs of every Docker container to Loki.
# Each line gets `container` (the Docker name), so any project can be watched without changes;
# a container that declares the `service_id` label also gets `service_id`.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_service_id]
        target_label: service_id
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
