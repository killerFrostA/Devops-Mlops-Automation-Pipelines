apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-api-boundary
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: platform-api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 8000}]
  egress: []
