# Observability for the lab, namespace monitoring:
# - kube-state-metrics: pod limits and restarts (kube_pod_container_*);
# - Prometheus: scrapes cAdvisor (through the API server), kube-state-metrics and annotated pods;
# - Loki: single binary, filesystem storage;
# - Fluent Bit: ships prod container logs to Loki with labels namespace, app, pod.
# Prometheus is published on host port 9091 and Loki on 3100 (see kind-cluster.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: pids-lab-prometheus}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: pids-lab-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: pids-lab-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: monitoring}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: monitoring}
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_(memory_working_set_bytes|cpu_usage_seconds_total|oom_events_total)
            action: keep
      - job_name: kube-state-metrics
        honor_labels: true
        static_configs: [{targets: ["kube-state-metrics.monitoring.svc:8080"]}]
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: kube_pod_container_(resource_limits|status_restarts_total|status_last_terminated_reason|status_waiting_reason)|kube_deployment_.*
            action: keep
      - job_name: pods
        kubernetes_sd_configs: [{role: pod}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: monitoring}
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090, nodePort: 30090}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: pids-lab-kube-state-metrics}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: pids-lab-kube-state-metrics}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: pids-lab-kube-state-metrics}
subjects: [{kind: ServiceAccount, name: kube-state-metrics, namespace: monitoring}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
          args: ["--resources=pods,nodes,namespaces,deployments,replicasets"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: monitoring}
spec:
  selector: {app: kube-state-metrics}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: loki-config, namespace: monitoring}
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      replication_factor: 1
      ring: {kvstore: {store: inmemory}}
      storage:
        filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    limits_config:
      reject_old_samples: false
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.5.0
          args: [-config.file=/etc/loki/loki.yaml]
          ports: [{containerPort: 3100}]
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 192Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - {name: config, configMap: {name: loki-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: monitoring}
spec:
  type: NodePort
  selector: {app: loki}
  ports: [{port: 3100, targetPort: 3100, nodePort: 30100}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fluent-bit, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: pids-lab-fluent-bit}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: pids-lab-fluent-bit}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: pids-lab-fluent-bit}
subjects: [{kind: ServiceAccount, name: fluent-bit, namespace: monitoring}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: fluent-bit-config, namespace: monitoring}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    warn
    [INPUT]
        Name              tail
        Path              /var/log/containers/*_prod_*.log
        Tag               kube.*
        multiline.parser  cri
        Mem_Buf_Limit     5MB
        Refresh_Interval  5
        Read_from_Head    On
    [FILTER]
        Name         kubernetes
        Match        kube.*
        Merge_Log    Off
        Labels       On
        Annotations  Off
    [OUTPUT]
        Name             loki
        Match            kube.*
        Host             loki.monitoring.svc
        Port             3100
        labels           job=fluent-bit, namespace=$kubernetes['namespace_name'], app=$kubernetes['labels']['app'], pod=$kubernetes['pod_name']
        remove_keys      kubernetes, stream, _p, time
        drop_single_key  on
        line_format      key_value
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: fluent-bit, namespace: monitoring}
spec:
  selector: {matchLabels: {app: fluent-bit}}
  template:
    metadata: {labels: {app: fluent-bit}}
    spec:
      serviceAccountName: fluent-bit
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.0.3
          args: [-c, /fluent-bit/etc/custom/fluent-bit.conf]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc/custom}
            - {name: varlog, mountPath: /var/log, readOnly: true}
      volumes:
        - {name: config, configMap: {name: fluent-bit-config}}
        - {name: varlog, hostPath: {path: /var/log}}
