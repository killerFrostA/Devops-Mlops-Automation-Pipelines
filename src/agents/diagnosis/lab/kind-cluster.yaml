# Single-node kind cluster for the Agent 2 lab (sized for ~3.5 GB of Docker memory).
# Prometheus and Loki run inside the cluster and are published on localhost only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pids-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30090   # Prometheus NodePort
        hostPort: 9091          # 9090 is left to the project's compose Prometheus
        listenAddress: 127.0.0.1
      - containerPort: 30100   # Loki NodePort
        hostPort: 3100
        listenAddress: 127.0.0.1
