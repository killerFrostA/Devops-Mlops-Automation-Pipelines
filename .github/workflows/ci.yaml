name: Quality
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        os: [ubuntu-latest, windows-latest]
    env:
      PIDS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install pinned development environment
        run: python -m pip install -r requirements/dev.lock
      - name: Install editable package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify scaffold
        run: python scripts/check.py
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all local profiles
        run: docker compose --profile backbone --profile agents --profile intelligence --profile observability config --quiet

  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned RPC tools
        run: python -m pip install -r requirements/rpc.lock
      - name: Compile RPC contracts without modifying the checkout
        run: python scripts/generate_protos.py --check
